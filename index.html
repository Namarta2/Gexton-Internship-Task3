<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Random Quote Generator</h1>

        <div class="quote-card" id="quoteCard">

            <p id="quote" class="quote">
                "The journey of a thousand miles begins with one step."
            </p>

            <h3 id="author">- Lao Tzu</h3>

            <h5 id="published">Published Date: July 2025</h5>

            <div class="buttons">

                <button id="newQuoteBtn">New Quote</button>

                <button id="copyBtn">
                    Copy
                    <span id="copiedMsg">Copied!</span>
                </button>

                <button id="tweetBtn">Tweet</button>

                <button id="favBtn">🤍 Favourite</button>

            </div>

        </div>

        <div class="fav-section">

            <h2>Favourite Quotes</h2>

            <ul id="favList"></ul>

        </div>

    </div>

    <script src="script.js"></script>



</body>
</html>
